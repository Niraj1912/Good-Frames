name: photo_swipe
description: "Good Frames: swipe through photos to keep or delete them."
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Material's colour science (HCT). Flutter already uses it; listed
  # because the app uses it directly, to find a photo's main colour.
  material_color_utilities: ^0.13.0
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.12.0

flutter:
  uses-material-design: true

  # Inter, a free font (SIL Open Font Licence, assets/fonts/OFL.txt) with
  # a look close to Apple's. Bundled so it works offline and costs nothing.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
  assets:
    - assets/fonts/OFL.txt
