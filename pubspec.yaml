name: good_frames
description: "Good Frames: swipe through photos to keep or delete them."
publish_to: 'none'
version: 1.3.2+9

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Material's colour science (HCT). Flutter already uses it; listed
  # because the app uses it directly, to find a photo's main colour.
  material_color_utilities: ^0.13.0
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  share_plus: ^13.3.1
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.12.0

flutter:
  uses-material-design: true

  # Two free fonts (SIL Open Font Licence, the OFL-*.txt files beside them),
  # bundled so they work offline and cost nothing: Bricolage Grotesque for
  # all text, and Barlow Condensed for frame numbers, like the print on the
  # edge of a film.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
          weight: 400
        - asset: assets/fonts/Bricolage.ttf
          weight: 500
        - asset: assets/fonts/Bricolage.ttf
          weight: 600
        - asset: assets/fonts/Bricolage.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
  assets:
    - assets/fonts/OFL-Bricolage.txt
    - assets/fonts/OFL-Barlow.txt
